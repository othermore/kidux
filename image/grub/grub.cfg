# The image's boot menu, for a computer that starts with UEFI or a BIOS
# alike (ci/build-image.sh). Every entry starts the live system with the
# installer (kidux.live), in a language and with its keyboard.
search --no-floppy --set=root --file /.disk/info
set default=0
set timeout=10
set color_normal=light-gray/black
set color_highlight=black/light-gray
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-gray

menuentry "Instalar Kidux" {
    linux /live/vmlinuz boot=live quiet splash kidux.live kidux.lang=es_ES.UTF-8 kidux.keyboard=es
    initrd /live/initrd.img
}
menuentry "Install Kidux" {
    linux /live/vmlinuz boot=live quiet splash kidux.live kidux.lang=en_US.UTF-8 kidux.keyboard=us
    initrd /live/initrd.img
}
submenu "Gráficos seguros / Safe graphics" {
    menuentry "Instalar Kidux (gráficos seguros)" {
        linux /live/vmlinuz boot=live nomodeset kidux.live kidux.lang=es_ES.UTF-8 kidux.keyboard=es
        initrd /live/initrd.img
    }
    menuentry "Install Kidux (safe graphics)" {
        linux /live/vmlinuz boot=live nomodeset kidux.live kidux.lang=en_US.UTF-8 kidux.keyboard=us
        initrd /live/initrd.img
    }
}
