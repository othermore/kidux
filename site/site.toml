# The website's facts, the same in every language (docs/dev/website.md).

# Where the site is published, with its final slash.
url = "https://kidux.org/"
# The language of the page at the site's root; every other has its folder.
default_language = "en"

repository = "https://github.com/othermore/kidux"
# Where a donation is made: the owner's GitHub Sponsors page.
sponsors = "https://github.com/sponsors/othermore"
# GitHub's own Sponsor button, shown where the page asks for a donation.
sponsors_button = "https://github.com/sponsors/othermore/button"
# Who develops Kidux, their own page, and where to write.
owner = "Antonio Morales García"
owner_url = "https://antonio.mg"
email = "info@kidux.org"

# The installer, the newest release's image, by its name without a version
# (docs/dev/image.md, section 6).
download = "https://iso.kidux.org/kidux-amd64.iso"
# The user guide's page on trying Kidux in an emulator, in each language's
# folder of docs/.
try = "try.md"

# Google Analytics' measurement id, `G-…`: with it the page asks the visitor
# whether it may count visits and, on a yes, loads Google's tag; empty, the
# page carries no tag and no notice.
analytics = "G-LHD6DKXB9P"
# Where GoatCounter counts the site's visits, without cookies, beside
# Google's, so that the owner can compare the two (D94); empty, no count.
goatcounter = "https://kidux.goatcounter.com/count"
