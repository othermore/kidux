# The website's words in Spanish. Every language's file has the same keys
# (tests/project/site.py); a sentence is kept short, the page is read fast.

[language]
name = "Español"

[meta]
title = "Kidux: el primer ordenador de un niño, seguro y listo para aprender"
description = "Un sistema operativo seguro, educativo y sin distracciones para el primer ordenador de tus hijos. Incluye módulos de aprendizaje listos para usar y funciona en equipos nuevos o antiguos. Software libre y gratuito para todos."

[nav]
label = "Secciones"
what = "Qué es"
modules = "Módulos"
docs = "Manual"
adults = "Para adultos"
licence = "Licencia"
contact = "Contacto"
support = "Donar"

[hero]
title = "Su primer ordenador. Seguro y sin distracciones."
lead = "Kidux transforma cualquier ordenador en un entorno educativo protegido, intuitivo y listo para aprender. Dale a tus hijos su propio equipo con total tranquilidad."
get = "Consigue Kidux"
docs = "Leer el manual"
support = "Apoya el proyecto"
note = "Gratis para todos · En español y en inglés · Software libre"
picture = "La pantalla de un niño en Kidux, con un dibujo por cada módulo de aprendizaje"

[pillars.safe]
title = "Un sistema entero y seguro"
text = "Kidux no es una aplicación ni un control parental superficial: es el ordenador completo. Sin anuncios, sin compras integradas y sin acceso libre a internet. Los niños solo acceden a las herramientas que tú apruebas."

[pillars.focus]
title = "Una cosa cada vez"
text = "Cada actividad ocupa toda la pantalla para evitar distracciones y fomentar la concentración. Cuando el niño crezca y esté preparado, puedes activar el modo ventanas para aprender a manejar un escritorio tradicional."

[pillars.learn]
title = "Aprender, sin preparar nada"
text = "Programación por bloques y texto, lógica, matemáticas, ciencia, lectura y mecanografía. Los módulos se instalan con un clic y vienen preconfigurados, con especial atención a las disciplinas STEM."

[pillars.hardware]
title = "En el ordenador que ya tienes"
text = "Funciona con fluidez en casi cualquier PC o portátil de 64 bits fabricado desde 2008. Reutiliza ese equipo que tienes en casa y dale una segunda vida útil con propósito."
soon = "Raspberry Pi 5, muy pronto"

[child]
title = "Un ordenador que es suyo"
lead = "Su propio avatar, su nombre y su contraseña personal. Dentro, un espacio educativo exclusivo con las actividades elegidas por la familia."
point1 = "Cada niño inicia sesión con su propio dibujo identificativo y su contraseña personal."
point2 = "Una interfaz limpia y protegida: sin menús complejos donde perderse ni opciones del sistema que puedan desconfigurarse."
point3 = "Los hermanos pueden compartir el mismo equipo por turnos, manteniendo separados sus trabajos, límites de tiempo e idioma."
picture = "La pantalla de entrada, con el dibujo de cada niño"

[grow]
title = "Crece con ellos"
lead = "Comienza con una interfaz guiada y sencilla, y abre nuevas posibilidades cuando estén preparados."
single_title = "Pantalla completa"
single_text = "El modo inicial para todos los niños: una sola actividad en pantalla para centrar la atención, con una barra inferior clara para volver al inicio."
single_picture = "Un módulo de aprendizaje ocupando la pantalla sobre la barra"
windows_title = "Modo ventanas"
windows_text = "Para niños más mayores: varios programas a la vista que se pueden mover, redimensionar y organizar, igual que en cualquier ordenador tradicional."
windows_picture = "Dos módulos de aprendizaje abiertos en ventanas"
guide = "Varios módulos incorporan una guía lateral interactiva con lecciones paso a paso, misiones prácticas y retos en el idioma del niño."

[modules]
title = "Múltiples formas de aprender, de 2 a 16 años"
lead = "Herramientas educativas de referencia internacional, instaladas y configuradas para tus hijos. Tú decides qué módulos puede utilizar cada uno."
more = "Cada módulo dispone de un capítulo detallado en el manual de uso: objetivos pedagógicos, edades recomendadas, requisitos y opciones de ajuste familiar."
guide = "Ver los módulos en el manual"
# The heading of the user guide's modules section, as its address has it.
anchor = "9-módulos-de-aprendizaje"

[modules.gcompris]
name = "GCompris"
age = "De 2 a 10 años"
text = "Más de 100 actividades lúdicas sobre lectura, cálculo, ciencia, colores y destreza con el teclado y el ratón. Funciona sin conexión una vez descargadas sus voces."
anchor = "gcompris"

[modules.scratchjr]
name = "ScratchJr"
age = "De 5 a 7 años"
text = "Iniciación a la programación para los más pequeños creando historias interactivas con bloques gráficos, incluso antes de aprender a leer."
anchor = "scratchjr"

[modules.blockly]
name = "Juegos de Blockly"
age = "De 6 a 12 años"
text = "Desafíos y puzles progresivos diseñados por Google para aprender los conceptos fundamentales de la programación sin necesidad de internet."
anchor = "juegos-de-blockly"

[modules.tuxtype]
name = "Tux Typing"
age = "De 6 a 12 años"
text = "Aprende mecanografía jugando: ayuda al pingüino Tux a atrapar peces y salvar cometas tecleando con rapidez y precisión."
anchor = "tux-typing"

[modules.scratch]
name = "Scratch"
age = "Desde 8 años"
text = "El entorno de programación por bloques más utilizado en las escuelas para crear videojuegos, animaciones y proyectos interactivos de forma local y segura."
anchor = "scratch"

[modules.turbowarp]
name = "TurboWarp"
age = "Desde 8 años"
text = "Una versión optimizada y acelerada de Scratch, ideal para que los proyectos más complejos funcionen con fluidez en ordenadores de recursos modestos."
anchor = "turbowarp"

[modules.basic]
name = "BASIC"
age = "De 8 a 14 años"
text = "Descubre la programación clásica en BASIC como en los primeros ordenadores domésticos, acompañado de una completa guía interactiva de 30 capítulos."
anchor = "basic"

[modules.wikipedia]
name = "Wikipedia"
age = "Desde 8 años"
text = "Consulta la enciclopedia libre completa en el idioma del niño y sus proyectos hermanos, manteniendo bloqueado el resto de internet para una navegación segura."
anchor = "wikipedia"

[modules.codecombat]
name = "CodeCombat"
age = "De 9 a 16 años"
text = "Aprende programación real en Python o JavaScript superando niveles en un juego de rol de mazmorras. Requiere conexión a internet y cuenta en la plataforma."
anchor = "codecombat"

[modules.mail]
name = "Correo"
age = "Desde 8 años"
text = "Un buzón de correo electrónico seguro y simplificado mediante Thunderbird, configurado previamente por el adulto para que el niño solo tenga que leer y redactar."
anchor = "correo"

[modules.gmail]
name = "Gmail"
age = "Desde 8 años"
text = "Acceso directo y exclusivo a la versión web de Gmail, ideal para cuentas infantiles gestionadas con Google Family Link, con el resto de internet protegido."
anchor = "gmail"

[modules.kig]
name = "Kig"
age = "De 10 a 14 años"
text = "Geometría interactiva y dinámica: traza puntos, rectas y polígonos que conservan sus reglas matemáticas al arrastrarlos. Incluye lecciones guiadas y misiones prácticas."
anchor = "kig"

[modules.kalzium]
name = "Kalzium"
age = "De 10 años en adelante"
text = "Explora la tabla periódica con fotografías reales, modelos atómicos, simulador de estados de la materia y lecciones guiadas, sin necesidad de internet."
anchor = "kalzium"

[modules.step]
name = "Step"
age = "De 10 años en adelante"
text = "Un simulador de física interactivo para experimentar con masas, muelles, gravedad y fuerzas en tiempo real. Incluye experimentos guiados paso a paso."
anchor = "step"

[modules.simulations]
name = "Simulaciones"
age = "De 6 a 14 años"
text = "Colección de 51 simulaciones interactivas de ciencias y matemáticas creadas por PhET (Universidad de Colorado), almacenadas localmente para jugar y experimentar."
anchor = "simulaciones"

[modules.photography]
name = "Fotografía"
age = "De 8 a 12 años"
text = "Un curso práctico de fotografía en treinta lecciones para aprender a usar una cámara real: iluminación, apertura, velocidad y encuadre, con retos para practicar."
anchor = "fotografía"

[adults]
title = "Tú decides las reglas. Desde un único lugar."
lead = "Un panel de administración exclusivo para adultos, protegido por una contraseña maestra que nunca se introduce en presencia de los niños."
point1 = "Establece el tiempo máximo de uso diario y los días de la semana permitidos."
point2 = "Selecciona de forma individual qué módulos y herramientas puede usar cada hijo."
point3 = "Concede minutos adicionales en cualquier momento o ajusta el tiempo restante del día."
point4 = "Al agotarse el tiempo asignado, la pantalla se bloquea de forma segura sin perder ningún trabajo en curso."
picture = "La página de un niño en el panel del adulto, con su tiempo y sus días"

[get]
title = "Consigue Kidux"
lead = "Descarga el instalador para un ordenador propio, o prueba Kidux primero en un emulador."
now = "Disponible hoy"
needs = "Requisitos del sistema"
need1 = "Un ordenador con procesador de 64 bits: compatible con casi cualquier PC o portátil fabricado desde 2008."
need2 = "2 GB de memoria RAM (se recomiendan 4 GB para mayor soltura)."
need3 = "32 GB de espacio en disco (se utiliza el disco completo)."
need4 = "Pantalla con resolución mínima de 1280 × 800 píxeles. Se recomienda 1920 × 1080 o pantallas de alta densidad (como la pantalla Retina de un MacBook). En pantallas menores, algunas actividades pueden tener partes ocultas o no funcionar bien."

[get.image]
title = "Descargar el instalador"
text = "La imagen de Kidux, de unos 900 MB: se graba en una memoria USB, se arranca el ordenador desde ella, con el arranque seguro activado o no, y el instalador gráfico deja Kidux en el disco entero en pocos minutos."
download = "Descargar Kidux"

[get.try]
title = "Probarlo primero"
text = "Una imagen lista para VirtualBox, UTM o QEMU arranca Kidux dentro de una ventana en Windows, macOS o Linux, con un niño y seis módulos ya preparados, sin instalar nada en el propio ordenador."
button = "Probar Kidux en un emulador"

[get.debian]
title = "Sobre Debian 13"
text = "Instala un sistema limpio de Debian 13 sin entorno de escritorio, añade el repositorio oficial de Kidux e instala el sistema completo mediante paquetes deb. El manual contiene todos los pasos."
button = "Ver los pasos de instalación"
# The heading of the user guide the button leads to, as its address has it.
anchor = "2-instalar-kidux"

[licence]
title = "Software libre, para todos"
lead = "Kidux se publica bajo la GNU General Public License, versión 3 o posterior: condiciones claras, honestas e iguales para todo el mundo."

[licence.home]
title = "En el hogar: siempre gratuito"
text = "Uso libre y gratuito para ti y los menores a tu cargo en el ámbito familiar. Sin necesidad de registrar cuentas, sin licencias que pedir y sin letra pequeña."

[licence.schools]
title = "Colegios y organizaciones"
text = "También es gratuito para centros escolares, academias y proyectos comunitarios, sin nada que pedir. Nos encantaría que nos escribieras, para saber dónde ayuda Kidux a los niños."
button = "Cuéntanos tu colegio"
subject = "Kidux en nuestro colegio"

[licence.code]
title = "Código que cualquiera puede estudiar y cambiar"
text = "El código fuente completo está publicado en GitHub bajo la GNU GPLv3, y cualquiera puede usarlo, estudiarlo, modificarlo y compartirlo."
button = "Ver el repositorio"

[support]
title = "Apoyar a Kidux"
text = "Kidux es un proyecto independiente desarrollado durante fines de semana y ratos libres. Las donaciones voluntarias ayudan a costear la infraestructura y nos motivan a seguir manteniendo y ampliando el sistema."
button = "Donar con GitHub Sponsors"
frame = "Patrocina al desarrollador de Kidux en GitHub"
note = "Cualquier contribución, por pequeña que sea, es de gran ayuda. Muchas gracias."

[contact]
title = "Contacto"
text = "Si tienes dudas, propuestas o representas a un colegio que desea utilizar Kidux, no dudes en escribirnos."
who = "Desarrollado por"
email = "Correo electrónico"
code = "Código y seguimiento de incidencias"
code_text = "Kidux en GitHub"

[footer]
rights = "© 2026"
licence = "Kidux es software libre, publicado bajo la GNU General Public License, versión 3 o posterior."
visits = "Las visitas también se contabilizan mediante GoatCounter, que no utiliza cookies de rastreo."
others = "GCompris, ScratchJr, Juegos de Blockly, Tux Typing, Scratch, TurboWarp, wwwBASIC, CodeCombat, Wikipedia, Kig, Kalzium, Step y las simulaciones de PhET pertenecen a sus respectivos autores y conservan sus propias licencias. Kidux está construido sobre Debian y no está afiliado a ninguno de ellos."

[cookies]
title = "¿Podemos usar cookies para contar las visitas?"
text = "Contabilizamos las visitas con Google Analytics. Al aceptar cookies, la herramienta puede distinguir si se trata de una visita nueva o recurrente. Si las rechazas, solo se registra la visita sin almacenar nada en tu navegador."
accept = "Aceptar con cookies"
reject = "Continuar sin cookies"
