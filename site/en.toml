# The website's words in English. Every language's file has the same keys
# (tests/project/site.py); a sentence is kept short, the page is read fast.

[language]
name = "English"

[meta]
title = "Kidux: A child's first computer, safe and ready to learn"
description = "A complete, safe, and distraction-free operating system for children. Features ready-to-use learning modules on new or existing computers. Free for families."

[nav]
label = "Sections"
what = "About"
modules = "Modules"
docs = "User guide"
adults = "Adult panel"
licence = "Licence"
contact = "Contact"
support = "Support"

[hero]
title = "Their first computer. Safe, focused, and ready to learn."
lead = "Kidux turns any computer into a protected educational environment designed specifically for children. Give your child their own computer with complete peace of mind."
get = "Get Kidux"
docs = "Read the guide"
support = "Support the project"
note = "Free for families · English and Spanish · Published source code"
picture = "A child's screen in Kidux, showing a tile for each learning module"

[pillars.safe]
title = "A complete and secure system"
text = "Kidux is not just an application or a surface-level filter on top of something else: it is the entire operating system. No advertisements, no app stores, and no unrestricted web access. Children only access what you approve."

[pillars.focus]
title = "One activity at a time"
text = "By default, each activity opens full screen to minimize distractions and encourage concentration. As your child grows and feels ready, you can enable windows to introduce them to a traditional desktop environment."

[pillars.learn]
title = "Learn immediately, with zero setup"
text = "Block and text programming, logic, mathematics, science, reading, and touch typing. All modules are pre-configured, focused on STEM education, and ready to explore."

[pillars.hardware]
title = "Runs on hardware you already own"
text = "Runs smoothly on almost any 64-bit PC or laptop manufactured since 2008. Give that older computer in your home a purposeful second life."
soon = "Raspberry Pi 5, coming soon"

[child]
title = "A computer of their very own"
lead = "Their own avatar, their own name, and their own password. Inside, a personalized space containing only the activities chosen by their family."
point1 = "Each child signs in using their own unique avatar and personal password."
point2 = "A clean and protected interface: no confusing desktop clutter, no system settings to break, and no escape hatches."
point3 = "Siblings can easily take turns sharing the same computer, keeping their work, limits, and language preferences separate."
picture = "The sign-in screen, showing each child's avatar"

[grow]
title = "Grows with your child"
lead = "Start with a guided, distraction-free interface, and unlock advanced features whenever they are ready."
single_title = "Full-screen mode"
single_text = "The ideal starting point: one activity fills the screen to keep attention focused, with an intuitive bottom bar to return home."
single_picture = "A learning module filling the screen above the bar"
windows_title = "Windowed mode"
windows_text = "For older children: multiple applications visible simultaneously that can be moved, resized, and arranged just like on a standard desktop."
windows_picture = "Two learning modules open in windows"
guide = "Several modules include an integrated interactive sidebar with step-by-step lessons, hands-on missions, and creative ideas in the child's language."

[modules]
title = "Multiple ways to learn, ages 2 to 16"
lead = "Trusted educational tools used in classrooms worldwide, installed and managed by you. You choose which activities are available to each child."
more = "Every module has a dedicated chapter in the user guide detailing its educational goals, recommended ages, requirements, and family configuration options."
guide = "Explore modules in the guide"
# The heading of the user guide's modules section, as its address has it.
anchor = "9-learning-modules"

[modules.gcompris]
name = "GCompris"
age = "Ages 2 to 10"
text = "Over 100 playful educational activities covering reading, arithmetic, science, colors, and keyboard and mouse skills. Works offline once its voices are downloaded."
anchor = "gcompris"

[modules.scratchjr]
name = "ScratchJr"
age = "Ages 5 to 7"
text = "An introductory programming environment for young children to create interactive stories using intuitive visual blocks, even before learning to read."
anchor = "scratchjr"

[modules.blockly]
name = "Blockly Games"
age = "Ages 6 to 12"
text = "A series of progressive puzzles designed by Google that teach fundamental programming principles step by step, without needing an internet connection."
anchor = "blockly-games"

[modules.tuxtype]
name = "Tux Typing"
age = "Ages 6 to 12"
text = "Learn touch typing through fun arcade games: help Tux catch falling fish and protect comets by typing characters accurately and quickly."
anchor = "tux-typing"

[modules.scratch]
name = "Scratch"
age = "Ages 8 and up"
text = "The world's leading block-based programming environment used in schools to create games, animations, and interactive stories safely and locally."
anchor = "scratch"

[modules.turbowarp]
name = "TurboWarp"
age = "Ages 8 and up"
text = "An optimized, high-performance compiler for Scratch projects, ensuring complex games and scripts run smoothly even on older or modest hardware."
anchor = "turbowarp"

[modules.basic]
name = "BASIC"
age = "Ages 8 to 14"
text = "Explore classic computer programming in BASIC as it began on early home computers, accompanied by an interactive 30-chapter tutorial guide."
anchor = "basic"

[modules.wikipedia]
name = "Wikipedia"
age = "Ages 8 and up"
text = "Access the entire Wikipedia encyclopedia in the child's language along with sister reference projects, with the rest of the internet safely blocked."
anchor = "wikipedia"

[modules.codecombat]
name = "CodeCombat"
age = "Ages 9 to 16"
text = "Learn real Python or JavaScript by navigating a role-playing dungeon adventure. Requires an active internet connection and a platform account."
anchor = "codecombat"

[modules.mail]
name = "Mail"
age = "Ages 8 and up"
text = "A secure, simplified email client powered by Thunderbird, pre-configured by an adult so the child can read and write messages without setup hassle."
anchor = "mail"

[modules.gmail]
name = "Gmail"
age = "Ages 8 and up"
text = "Direct, dedicated access to the web interface of Gmail—ideal for child accounts managed under Google Family Link—with all other websites blocked."
anchor = "gmail"

[modules.kig]
name = "Kig"
age = "Ages 10 to 14"
text = "Interactive, dynamic geometry: plot points, lines, and polygons that maintain geometric rules when dragged. Includes guided lessons and hands-on missions."
anchor = "kig"

[modules.kalzium]
name = "Kalzium"
age = "Ages 10 and up"
text = "Explore the periodic table with high-resolution photos, atomic models, state-of-matter simulations, and step-by-step guided lessons offline."
anchor = "kalzium"

[modules.step]
name = "Step"
age = "Ages 10 and up"
text = "An interactive physics laboratory to simulate forces, springs, gravity, and velocities in real time. Includes guided experiments and challenges."
anchor = "step"

[modules.simulations]
name = "Simulations"
age = "Ages 6 to 14"
text = "A curated collection of 51 interactive science and math simulations by PhET (University of Colorado), stored locally for offline experimentation."
anchor = "simulations"

[modules.photography]
name = "Photography"
age = "Ages 8 to 12"
text = "A comprehensive thirty-chapter photography tutorial for learning with a real camera: light, shutter speed, aperture, focus, and framing, with practical exercises."
anchor = "photography"

[adults]
title = "You decide the rules. From one place."
lead = "A dedicated adult administration panel, protected by a master password that is never typed in front of children."
point1 = "Set daily computer time allowances and specify permitted days of the week."
point2 = "Individually select which educational modules each child can access."
point3 = "Grant additional bonus time on the spot or adjust remaining minutes at any time."
point4 = "When time runs out, the screen locks safely without losing any work in progress."
picture = "A child's profile in the adult panel, displaying their time limits and active days"

[get]
title = "Get Kidux"
lead = "Two convenient installation options."
soon = "Coming soon"
now = "Available today"
needs = "System requirements"
need1 = "A 64-bit computer: compatible with almost any PC or laptop manufactured since 2008."
need2 = "2 GB of RAM (4 GB recommended for smoother multitasking)."
need3 = "32 GB of storage space (the entire drive is utilized)."
need4 = "A display resolution of at least 1280 × 800 pixels. 1920 × 1080 or a high-density display (such as a MacBook Retina screen) is recommended. On a smaller screen, some activities may have parts hidden or not work well."

[get.image]
title = "Kidux disk image"
text = "Download the ready-to-use disk image, write it to a USB flash drive or SD card, boot your computer from it, and follow the simple on-screen setup."
download = "Download Kidux"

[get.debian]
title = "On Debian 13"
text = "Install a minimal Debian 13 'trixie' system without a desktop environment, add the official Kidux package repository, and install the software. The guide covers every step."
button = "Read installation steps"
# The heading of the user guide the button leads to, as its address has it.
anchor = "2-installing-kidux"

[licence]
title = "Free software, for everyone"
lead = "Kidux is published under the GNU General Public License, version 3 or later: clear, honest, and the same terms for everyone."

[licence.home]
title = "At home: completely free"
text = "Unlimited free use for you and the children in your care at home. No mandatory accounts, no licence to ask for, and no hidden fine print."

[licence.schools]
title = "Schools and organisations"
text = "Free as well for schools, academies and community projects, with nothing to ask for. We would simply love to hear from you, to learn where Kidux helps children."
button = "Tell us about your school"
subject = "Kidux at our school"

[licence.code]
title = "Free and published code"
text = "Every line of source code is published on GitHub under the GNU GPLv3, and anyone may use it, study it, change it and share it."
button = "View the code"

[support]
title = "Supporting Kidux"
text = "Kidux is an independent community project developed during weekends and personal time. Voluntary donations help cover server costs and motivate us to keep improving and expanding the system."
button = "Donate with GitHub Sponsors"
frame = "Sponsor Kidux's developer on GitHub"
note = "Contributions of any size are deeply appreciated. Thank you for your support."

[contact]
title = "Contact"
text = "Whether you have questions, feedback, or represent a school interested in deploying Kidux, we would love to hear from you."
who = "Developed by"
email = "Email"
code = "Code and issue tracker"
code_text = "Kidux on GitHub"

