<?xml version="1.0" encoding="UTF-8"?>
<!-- Kidux wordmark. Drawn, not typed: five letters as one rounded stroke,
     so it needs no font and renders the same everywhere. Change the colour
     by editing the one stroke attribute. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 100" width="262" height="100"
     role="img" aria-label="kidux, for dark backgrounds">
  <g fill="none" stroke="#fff6e9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- k -->
    <path d="M12 12 V80"/>
    <path d="M42 38 L12 62"/>
    <path d="M24 52 L44 80"/>
    <!-- i -->
    <path d="M66 40 V80"/>
    <!-- d -->
    <circle cx="104" cy="58" r="22"/>
    <path d="M126 12 V80"/>
    <!-- u -->
    <path d="M148 38 V60 A20 20 0 0 0 188 60 V38"/>
    <path d="M188 38 V80"/>
    <!-- x -->
    <path d="M210 38 L250 80"/>
    <path d="M250 38 L210 80"/>
  </g>
  <!-- the dot of the i, in the mascot's beak colour -->
  <circle cx="66" cy="18" r="9" fill="#f0a202"/>
</svg>
