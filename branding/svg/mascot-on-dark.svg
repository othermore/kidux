<?xml version="1.0" encoding="UTF-8"?>
<!-- Kidux mascot: a penguin chick, after Tux. Flat shapes, no gradients, no
     strokes thinner than 4 units, so it reads at 32 px and at a metre wide.
     The colours are the brand palette in branding/README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 216 216" width="200" height="200"
     role="img" aria-label="Kidux mascot, for dark backgrounds">
  <!-- a halo, so the dark body reads on a dark background -->
  <path d="M100 26 C150 26 170 78 170 120 C170 158 140 184 100 184 C60 184 30 158 30 120 C30 78 50 26 100 26 Z" fill="none" stroke="#fff6e9" stroke-width="8" stroke-linejoin="round"/>
  <ellipse cx="27" cy="128" rx="13" ry="34" transform="rotate(24 27 128)" fill="none" stroke="#fff6e9" stroke-width="8"/>
  <ellipse cx="173" cy="128" rx="13" ry="34" transform="rotate(-24 173 128)" fill="none" stroke="#fff6e9" stroke-width="8"/>
  <ellipse cx="80" cy="184" rx="21" ry="9" fill="none" stroke="#fff6e9" stroke-width="8"/>
  <ellipse cx="120" cy="184" rx="21" ry="9" fill="none" stroke="#fff6e9" stroke-width="8"/>
  <path d="M90 30 C88 20 82 15 76 14 M100 26 C100 17 100 12 100 8 M110 30 C112 20 118 15 124 14" fill="none" stroke="#fff6e9" stroke-width="10" stroke-linecap="round"/>
  <!-- feet, under the body -->
  <ellipse cx="80" cy="184" rx="21" ry="9" fill="#f0a202"/>
  <ellipse cx="120" cy="184" rx="21" ry="9" fill="#f0a202"/>
  <!-- flippers -->
  <ellipse cx="27" cy="128" rx="13" ry="34" transform="rotate(24 27 128)" fill="#4a6483"/>
  <ellipse cx="173" cy="128" rx="13" ry="34" transform="rotate(-24 173 128)" fill="#4a6483"/>
  <!-- body -->
  <path d="M100 26 C150 26 170 78 170 120 C170 158 140 184 100 184 C60 184 30 158 30 120 C30 78 50 26 100 26 Z" fill="#3d5470"/>
  <!-- the white front: face and belly in one -->
  <path d="M100 54 C128 54 146 78 148 114 C150 150 132 176 100 176 C68 176 50 150 52 114 C54 78 72 54 100 54 Z" fill="#fdf6f0"/>
  <!-- tuft -->
  <path d="M90 30 C88 20 82 15 76 14" fill="none" stroke="#3d5470" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 26 C100 17 100 12 100 8" fill="none" stroke="#3d5470" stroke-width="6" stroke-linecap="round"/>
  <path d="M110 30 C112 20 118 15 124 14" fill="none" stroke="#3d5470" stroke-width="6" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="70" cy="104" r="7" fill="#f6d7c4"/>
  <circle cx="130" cy="104" r="7" fill="#f6d7c4"/>
  <!-- eyes -->
  <circle cx="84" cy="86" r="9" fill="#2b2b2b"/>
  <circle cx="116" cy="86" r="9" fill="#2b2b2b"/>
  <circle cx="87" cy="83" r="3" fill="#fdf6f0"/>
  <circle cx="119" cy="83" r="3" fill="#fdf6f0"/>
  <!-- beak -->
  <path d="M100 96 L86 104 L100 116 L114 104 Z" fill="#f0a202"/>
</svg>
