# Kidux boots its own entry, straight through, with no text on the way.
# docs/dev/session.md, section 7.
#
# Only while kidux-session is installed: this file is kept when the package
# is removed, and must then change nothing.
if [ -x /usr/libexec/kidux-session ]; then
    GRUB_DEFAULT=kidux
    # One invisible second: long enough to press Esc for the menu, which is
    # how an adult reaches recovery; short enough that nobody else notices.
    GRUB_TIMEOUT=1
    GRUB_TIMEOUT_STYLE=hidden
    GRUB_DISABLE_OS_PROBER=true
    # "splash": Kidux's logo while the machine starts (Plymouth, section 7).
    # Plymouth draws only text while any serial console is on the command
    # line; the logo belongs on the screen whatever else is attached.
    GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT quiet splash plymouth.ignore-serial-consoles loglevel=3 systemd.show_status=false vt.global_cursor_default=0"
fi
