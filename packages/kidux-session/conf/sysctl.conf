# docs/dev/session.md, section 6.

# No magic SysRq keys: Alt+SysRq+B reboots without asking anyone and
# Alt+SysRq+K kills the session.
kernel.sysrq = 0

# Only a process with CAP_SYS_PTRACE may attach to another. Without this one
# of a child's processes can read and drive another of the same child's,
# and children are given a programming language on purpose.
kernel.yama.ptrace_scope = 2
