# No text logins on the virtual terminals of a Kidux machine: a login prompt
# on a kiosk is a door with the lock taken off. The serial console is a
# different unit and is unaffected.
#
# For recovery, add kidux.console to the kernel command line from the GRUB
# menu, which needs the recovery password, and the terminals come back.
[Unit]
ConditionKernelCommandLine=kidux.console
