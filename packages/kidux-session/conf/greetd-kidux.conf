[Service]
ExecStart=
ExecStart=greetd --config /usr/share/kidux/greetd.toml

[Unit]
# greetd's own unit gives up after five failures in thirty seconds, which on a
# kiosk is a black screen with no way out. A sign-in screen that crashes on
# start is better restarted forever than not at all.
StartLimitIntervalSec=0
