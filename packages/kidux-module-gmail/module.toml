# The child's Google account (D90): its address, filled in on Google's
# sign-in page. No password: the adult types it there, in Google's window.
[[settings]]
key = "email"
kind = "text"
label = "Email address"
description = "The child's Google account. Gmail's sign-in page opens with it filled in."
