# Gmail: a door to Gmail's website (phase-4d-plan.md, 4.23; D85). Nothing
# of Gmail is shipped: the site, the mail and the account are Google's. It
# is the module for a child whose Google account is managed with Family
# Link, which Google does not let sign in to Thunderbird (Mail, D95).
id = "gmail"
version = "0.1.1"
name = "Gmail"
description = "The Gmail website for a Google account, including one managed with Family Link. Requires internet; an adult signs in with the child the first time, and the session stays. Kidux is not connected with Google."
min_age = 8
# Google's sign-in for Gmail, with the child's address filled in, which goes
# on to the inbox once the child is signed in.
launch = { web = "https://accounts.google.com/ServiceLogin?service=mail&continue=https%3A%2F%2Fmail.google.com%2Fmail%2F&Email={email}&hl={lang}" }
# Gmail's own hosts, read from Chromium's net log over signing in, the
# inbox, a message with pictures, an attachment's preview, writing a message
# and signing out: the mail, the sign-in, contacts and the account's menu,
# new mail and suggestions (clients6), Google's static files and fonts,
# pictures of people (lh3), attachments (mail-attachment) and the pictures
# inside messages (ci3 to ci6). Left out, with Gmail working without them:
# www.google.com, which is Search; play.google.com, which only takes usage
# logs; mail-ads.google.com, the ads; content.googleapis.com, Drive's list
# of programs to open an attachment with.
#
# Then the accounts host of each domain Google lists as its own
# (https://www.google.com/supported_domains, 187 on 2026-10-15): signing in
# passes through the one of the family's country, accounts.google.es in
# Spain, and stops on a blocked page without it.
hosts = ["mail.google.com", "apis.google.com", "contacts.google.com", "ogs.google.com",
         "clients6.google.com", "ssl.gstatic.com", "www.gstatic.com",
         "fonts.gstatic.com", "fonts.googleapis.com", "lh3.google.com",
         "lh3.googleusercontent.com", "mail-attachment.googleusercontent.com",
         "ci3.googleusercontent.com", "ci4.googleusercontent.com",
