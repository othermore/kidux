# Photography: a guide for a child with a real camera, from the box with
# a hole that every camera still is to composition and light, chapter by
# chapter, with things to try, photographs of each effect and drawings of
# what the camera's screen shows; served by kidux-webapps under
# /photography/ (phase-4e-plan.md; docs/dev/photography.md).
id = "photography"
version = "0.1.1"
name = "Photography"
description = "A guide to photography with a real camera: light, shutter speed, aperture, focus, and composition, with hands-on practice in every chapter."
min_age = 8
max_age = 12
launch = { webapp = "photography" }
categories = ["arts"]
i18n_domain = "kidux-module-photography"
memory_max = "1G"
