<!-- Chapter 20: a toy with a house behind it, seen from the side. Above,
     the camera close, its wide angle a broad fan: the toy fills it, and the
     house takes up only a little of the fan's width, so it looks small and
     far. Below, the camera far back, zoomed in, a narrow fan: the toy fills
     it just as much, and the house takes up half of it, as if just behind.
     The toy and the house are in the same place in both. Flat, no words. -->
