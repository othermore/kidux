<?xml version="1.0" encoding="UTF-8"?>
<!-- Chapter 1: a tree outside, a dark room with a hole in its wall, the
     light from the top and the foot of the tree crossing at the hole, and
     the tree upside down on the pale far wall. Flat, in the brand's
     colours, no words (branding/README.md). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- outside: the sky and the ground -->
  <rect x="0" y="0" width="250" height="240" fill="#cfe3f3"/>
  <rect x="0" y="240" width="250" height="60" fill="#9cc77a"/>
  <!-- the tree: trunk and crown -->
  <rect x="88" y="168" width="20" height="74" rx="6" fill="#8a5a3b"/>
  <circle cx="98" cy="128" r="54" fill="#4f9a4a"/>
  <circle cx="76" cy="110" r="20" fill="#5fae58"/>
  <!-- the room: dark, its wall with the hole -->
  <rect x="250" y="0" width="390" height="300" fill="#24313f"/>
  <rect x="250" y="0" width="18" height="300" fill="#141c26"/>
  <rect x="250" y="146" width="18" height="10" fill="#cfe3f3"/>
  <!-- the far wall, pale, and on it the tree upside down -->
  <rect x="520" y="30" width="100" height="240" rx="6" fill="#fdf6f0"/>
  <rect x="562" y="48" width="16" height="56" rx="5" fill="#8a5a3b" opacity="0.75"/>
  <circle cx="570" cy="166" r="46" fill="#4f9a4a" opacity="0.75"/>
  <circle cx="586" cy="184" r="17" fill="#5fae58" opacity="0.75"/>
  <!-- the light, straight through the hole: the top of the crown lands at
       the bottom of the wall, the foot of the trunk at its top -->
  <polygon points="98,74 259,148 259,154" fill="#f0a202" opacity="0.9"/>
  <polygon points="98,242 259,148 259,154" fill="#f0a202" opacity="0.9"/>
  <polygon points="259,148 259,154 520,212" fill="#f0a202" opacity="0.6"/>
  <polygon points="259,148 259,154 520,48" fill="#f0a202" opacity="0.6"/>
  <circle cx="98" cy="74" r="7" fill="#f0a202"/>
  <circle cx="98" cy="242" r="7" fill="#f0a202"/>
  <circle cx="520" cy="212" r="7" fill="#f0a202"/>
  <circle cx="520" cy="48" r="7" fill="#f0a202"/>
</svg>
