<?xml version="1.0" encoding="UTF-8"?>
<!-- Chapter 3: the Olympus XZ-2 seen from above and behind, as the child
     holds it, after the manual's drawing of its parts (p. 2, 3), drawn
     afresh: the mode dial in sun, the shutter button in tangerine with the
     zoom lever round it in sky, the ON/OFF button in snow, the flash's
     housing and the hot shoe in grey, the lens at the front. Flat, no
     words. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260">
  <rect x="0" y="0" width="640" height="260" fill="#fff6e9"/>
  <!-- the lens, at the front, and its control ring -->
  <rect x="250" y="20" width="180" height="70" rx="12" fill="#2f4157"/>
  <rect x="244" y="70" width="192" height="22" rx="8" fill="#5b6f86"/>
  <!-- the body seen from above -->
  <rect x="60" y="88" width="520" height="120" rx="30" fill="#24313f"/>
  <!-- the flash's housing, left, and the hot shoe in the middle -->
  <rect x="96" y="112" width="110" height="52" rx="10" fill="#5b6f86"/>
  <rect x="268" y="118" width="96" height="44" rx="6" fill="#7a6a60"/>
  <rect x="280" y="128" width="72" height="24" rx="4" fill="#5b4d45"/>
  <!-- the ON/OFF button -->
  <circle cx="398" cy="170" r="12" fill="#fdf6f0"/>
  <!-- the shutter button, and the zoom lever round it -->
  <circle cx="452" cy="138" r="30" fill="#cfe3f3"/>
  <rect x="418" y="128" width="16" height="20" rx="5" fill="#cfe3f3"/>
  <circle cx="452" cy="138" r="18" fill="#e2703a"/>
  <!-- the mode dial, at the right end -->
  <circle cx="530" cy="138" r="34" fill="#f0a202"/>
  <circle cx="530" cy="138" r="24" fill="#f6c14b"/>
  <circle cx="530" cy="114" r="4" fill="#24313f"/>
</svg>
