<!-- Kidux's mascot, the penguin chick of branding/svg/mascot.svg, cheering. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- feet, under the body -->
  <ellipse cx="80" cy="184" rx="21" ry="9" fill="#f0a202"/>
  <ellipse cx="120" cy="184" rx="21" ry="9" fill="#f0a202"/>
  <!-- flippers -->
  <ellipse cx="22" cy="74" rx="13" ry="34" transform="rotate(-32 22 74)" fill="#2f4157"/>
  <ellipse cx="178" cy="74" rx="13" ry="34" transform="rotate(32 178 74)" fill="#2f4157"/>
  <!-- body -->
  <path d="M100 26 C150 26 170 78 170 120 C170 158 140 184 100 184 C60 184 30 158 30 120 C30 78 50 26 100 26 Z" fill="#24313f"/>
  <!-- the white front: face and belly in one -->
  <path d="M100 54 C128 54 146 78 148 114 C150 150 132 176 100 176 C68 176 50 150 52 114 C54 78 72 54 100 54 Z" fill="#fdf6f0"/>
  <!-- tuft -->
  <path d="M90 30 C88 20 82 15 76 14" fill="none" stroke="#24313f" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 26 C100 17 100 12 100 8" fill="none" stroke="#24313f" stroke-width="6" stroke-linecap="round"/>
  <path d="M110 30 C112 20 118 15 124 14" fill="none" stroke="#24313f" stroke-width="6" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="70" cy="104" r="7" fill="#f6d7c4"/>
  <circle cx="130" cy="104" r="7" fill="#f6d7c4"/>
  <!-- eyes -->
  <circle cx="84" cy="86" r="9" fill="#2b2b2b"/>
  <circle cx="116" cy="86" r="9" fill="#2b2b2b"/>
  <circle cx="87" cy="83" r="3" fill="#fdf6f0"/>
  <circle cx="119" cy="83" r="3" fill="#fdf6f0"/>
  <!-- beak -->
  <path d="M100 96 L86 104 L100 116 L114 104 Z" fill="#f0a202"/>
  <!-- sparkles -->
  <path d="M30 22 L34 34 L46 38 L34 42 L30 54 L26 42 L14 38 L26 34 Z" fill="#f0a202"/>
  <path d="M172 14 L175 23 L184 26 L175 29 L172 38 L169 29 L160 26 L169 23 Z" fill="#f0a202"/>
