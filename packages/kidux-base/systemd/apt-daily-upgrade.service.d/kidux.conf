# Kidux's fence around Debian's daily upgrade (D115): it installs Kidux's
# stable suite as well as Debian's security updates, and dpkg must never
# replace the launcher or a module under a child who is using them. So the
# upgrade runs only when no child has a session; under one it is skipped,
# and kidux-daemon starts it again when the last child has logged out. The
# daemon also keeps children from signing in while it runs.
[Service]
ExecCondition=/usr/libexec/kidux-no-child-session
