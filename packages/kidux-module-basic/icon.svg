<?xml version="1.0" encoding="UTF-8"?>
<!-- BASIC's tile: a screen of the first home computers, a prompt and a
     block cursor on it, drawn like the avatars (branding/README.md). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <circle cx="100" cy="100" r="96" fill="#cfe3f3"/>
  <!-- the stand -->
  <path d="M84 148 L116 148 L122 166 L78 166 Z" fill="#2f4157"/>
  <rect x="62" y="162" width="76" height="10" rx="5" fill="#24313f"/>
  <!-- the screen -->
  <rect x="34" y="46" width="132" height="104" rx="16" fill="#24313f"/>
  <rect x="46" y="58" width="108" height="80" rx="8" fill="#1a2430"/>
  <!-- the prompt and the cursor -->
  <path d="M60 80 L74 90 L60 100" fill="none" stroke="#f0a202" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="84" y="94" width="18" height="8" rx="2" fill="#fdf6f0"/>
  <!-- a line already typed -->
  <rect x="60" y="114" width="56" height="7" rx="3.5" fill="#6fbf73"/>
</svg>
