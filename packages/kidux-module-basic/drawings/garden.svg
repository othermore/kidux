  <!-- the penguin, behind rock 7 -->
  <ellipse cx="130" cy="118" rx="20" ry="22" fill="#24313f"/>
  <ellipse cx="130" cy="122" rx="13" ry="14" fill="#fdf6f0"/>
  <circle cx="125" cy="114" r="3" fill="#2b2b2b"/><circle cx="135" cy="114" r="3" fill="#2b2b2b"/>
