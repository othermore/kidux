<!-- A secret code: each letter becomes the one after it in the alphabet. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 130" width="330" height="130">
  <g fill="#fdf6f0" stroke="#24313f" stroke-width="3">
    <rect x="10" y="10" width="50" height="44" rx="8"/><rect x="72" y="10" width="50" height="44" rx="8"/>
    <rect x="134" y="10" width="50" height="44" rx="8"/><rect x="196" y="10" width="50" height="44" rx="8"/>
    <rect x="258" y="10" width="50" height="44" rx="8"/>
  </g>
  <g fill="#f0a202" stroke="#24313f" stroke-width="3">
    <rect x="10" y="78" width="50" height="44" rx="8"/><rect x="72" y="78" width="50" height="44" rx="8"/>
    <rect x="134" y="78" width="50" height="44" rx="8"/><rect x="196" y="78" width="50" height="44" rx="8"/>
    <rect x="258" y="78" width="50" height="44" rx="8"/>
  </g>
  <g font-family="monospace" font-weight="bold" font-size="28" text-anchor="middle" fill="#24313f">
    <text x="35" y="42">A</text><text x="97" y="42">B</text><text x="159" y="42">C</text><text x="221" y="42">D</text><text x="283" y="42">E</text>
    <text x="35" y="110">B</text><text x="97" y="110">C</text><text x="159" y="110">D</text><text x="221" y="110">E</text><text x="283" y="110">F</text>
  </g>
  <g stroke="#24313f" stroke-width="3" stroke-linecap="round">
    <path d="M35 58 L35 74"/><path d="M97 58 L97 74"/><path d="M159 58 L159 74"/><path d="M221 58 L221 74"/><path d="M283 58 L283 74"/>
  </g>
</svg>
