<!-- The penguin's fish, doubled each day: one, two, four, eight, on the squares of a board. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" width="400" height="110">
  <g fill="#cfe3f3"><rect x="4" y="4" width="92" height="92" rx="8"/><rect x="204" y="4" width="92" height="92" rx="8"/></g>
  <g fill="#fdf6f0" stroke="#cfe3f3" stroke-width="4"><rect x="104" y="6" width="92" height="88" rx="8"/><rect x="304" y="6" width="92" height="88" rx="8"/></g>
  <defs>
    <g id="fish">
      <path d="M0 0 C6 -7 18 -7 22 0 C18 7 6 7 0 0 Z" fill="#3584e4"/>
      <path d="M22 0 L30 -6 L30 6 Z" fill="#3584e4"/>
      <circle cx="6" cy="-1" r="1.8" fill="#fdf6f0"/>
    </g>
  </defs>
  <use href="#fish" x="35" y="50"/>
  <use href="#fish" x="135" y="36"/><use href="#fish" x="135" y="64"/>
  <use href="#fish" x="214" y="36"/><use href="#fish" x="252" y="36"/>
  <use href="#fish" x="214" y="64"/><use href="#fish" x="252" y="64"/>
  <use href="#fish" x="312" y="24"/><use href="#fish" x="352" y="24"/>
  <use href="#fish" x="312" y="44"/><use href="#fish" x="352" y="44"/>
  <use href="#fish" x="312" y="64"/><use href="#fish" x="352" y="64"/>
  <use href="#fish" x="312" y="84"/><use href="#fish" x="352" y="84"/>
</svg>
