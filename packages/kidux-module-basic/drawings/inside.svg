<!-- Inside the computer: what is typed goes from the keyboard into the memory, and from the memory to the screen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150">
  <!-- the keyboard -->
  <rect x="6" y="80" width="110" height="56" rx="10" fill="#24313f"/>
  <g fill="#fdf6f0">
    <rect x="16" y="90" width="16" height="12" rx="3"/><rect x="38" y="90" width="16" height="12" rx="3"/>
    <rect x="60" y="90" width="16" height="12" rx="3"/><rect x="82" y="90" width="16" height="12" rx="3"/>
    <rect x="16" y="110" width="16" height="12" rx="3"/><rect x="38" y="110" width="38" height="12" rx="3"/>
    <rect x="82" y="110" width="16" height="12" rx="3"/>
  </g>
  <!-- the memory, a shelf of boxes -->
  <rect x="150" y="30" width="120" height="96" rx="12" fill="#cfe3f3"/>
  <g fill="#e8b878">
    <rect x="162" y="42" width="28" height="24" rx="3"/><rect x="196" y="42" width="28" height="24" rx="3"/>
    <rect x="230" y="42" width="28" height="24" rx="3"/><rect x="162" y="88" width="28" height="24" rx="3"/>
    <rect x="196" y="88" width="28" height="24" rx="3"/><rect x="230" y="88" width="28" height="24" rx="3"/>
  </g>
  <!-- the screen -->
  <rect x="304" y="20" width="110" height="84" rx="10" fill="#24313f"/>
  <rect x="314" y="30" width="90" height="64" rx="4" fill="#141c26"/>
  <g fill="#fdf6f0"><rect x="322" y="40" width="46" height="6"/><rect x="322" y="54" width="62" height="6"/><rect x="322" y="68" width="10" height="6"/></g>
  <rect x="344" y="104" width="30" height="14" fill="#24313f"/>
  <!-- the arrows -->
  <g stroke="#f0a202" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M118 100 L142 84"/><path d="M276 76 L298 66"/>
  </g>
  <g fill="#f0a202"><path d="M148 78 L130 80 L140 94 Z"/><path d="M304 62 L286 60 L292 76 Z"/></g>
</svg>
