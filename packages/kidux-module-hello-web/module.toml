# The reference web-application module (modules.md, section 5): hello's
# page again, as a web page kidux-webapps serves and Chromium shows, and
# the one to copy for a module made of web pages.
id = "hello-web"
version = "0.1.7"
name = "[Test] Hello on the web"
description = "The first page again, as a web page, with a link that stays closed."
min_age = 4
max_age = 8
recommended_before = ["hello"]         # the same page, before its web one
launch = { webapp = "hello-web" }
i18n_domain = "kidux-module-hello-web"
memory_max = "3G"
