# ScratchJr, for the youngest: MIT's own app, from its community desktop
# port, built at development time with a current Electron (upstream.toml,
# D68, D69), and started by a small program of the module's own
# (modules.md, section 5).
id = "scratchjr"
version = "1.3.2+git20201121.3"
name = "ScratchJr"
description = "Stories and games with blocks, without a word to read, for the youngest."
min_age = 5
max_age = 7
launch = { exec = "/usr/libexec/kidux-module-scratchjr" }
app_ids = ["ScratchJr", "scratchjr", "ScratchJr*"]    # what its window is called
categories = ["programming"]
i18n_domain = "kidux-module-scratchjr"
memory_max = "2G"
