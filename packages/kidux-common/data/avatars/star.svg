     role="img" aria-label="Star">
  <circle cx="60" cy="60" r="60" fill="#fff2cc"/>
  <path d="M60 22 L71 50 L101 52 L78 71 L86 100 L60 84 L34 100 L42 71 L19 52 L49 50 Z" fill="#f0b429"/>
  <circle cx="51" cy="58" r="5" fill="#2b2b2b"/>
