<?xml version="1.0" encoding="UTF-8"?>
<!-- Kidux avatar: Bear. Flat shapes on a filled circle, so it stays legible
     down to the 48 px the launcher shows it at. No gradients, no strokes
     thinner than 2 units, no text. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="Bear">
  <circle cx="60" cy="60" r="60" fill="#f3e2c7"/>
  <circle cx="32" cy="38" r="15" fill="#8b6a4f"/>
  <circle cx="88" cy="38" r="15" fill="#8b6a4f"/>
  <circle cx="60" cy="66" r="38" fill="#a67c52"/>
  <ellipse cx="60" cy="80" rx="20" ry="15" fill="#f0dcc4"/>
  <circle cx="47" cy="58" r="6" fill="#2b2b2b"/>
  <circle cx="73" cy="58" r="6" fill="#2b2b2b"/>
  <ellipse cx="60" cy="76" rx="8" ry="6" fill="#2b2b2b"/>
</svg>
