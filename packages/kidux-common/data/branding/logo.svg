<?xml version="1.0" encoding="UTF-8"?>
<!-- Kidux logo: the mascot and the wordmark together. Built from mascot.svg
     and wordmark.svg; edit those and run ci/render-branding.sh, which
     rebuilds this file. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200"
     role="img" aria-label="Kidux">
  <g transform="translate(0 0)">
  <!-- feet, under the body -->
  <ellipse cx="80" cy="184" rx="21" ry="9" fill="#f0a202"/>
  <ellipse cx="120" cy="184" rx="21" ry="9" fill="#f0a202"/>
  <!-- flippers -->
  <ellipse cx="27" cy="128" rx="13" ry="34" transform="rotate(24 27 128)" fill="#2f4157"/>
  <ellipse cx="173" cy="128" rx="13" ry="34" transform="rotate(-24 173 128)" fill="#2f4157"/>
  <!-- body -->
  <path d="M100 26 C150 26 170 78 170 120 C170 158 140 184 100 184 C60 184 30 158 30 120 C30 78 50 26 100 26 Z" fill="#24313f"/>
  <!-- the white front: face and belly in one -->
  <path d="M100 54 C128 54 146 78 148 114 C150 150 132 176 100 176 C68 176 50 150 52 114 C54 78 72 54 100 54 Z" fill="#fdf6f0"/>
  <!-- tuft -->
  <path d="M90 30 C88 20 82 15 76 14" fill="none" stroke="#24313f" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 26 C100 17 100 12 100 8" fill="none" stroke="#24313f" stroke-width="6" stroke-linecap="round"/>
  <path d="M110 30 C112 20 118 15 124 14" fill="none" stroke="#24313f" stroke-width="6" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="70" cy="104" r="7" fill="#f6d7c4"/>
  <circle cx="130" cy="104" r="7" fill="#f6d7c4"/>
  <!-- eyes -->
  <circle cx="84" cy="86" r="9" fill="#2b2b2b"/>
  <circle cx="116" cy="86" r="9" fill="#2b2b2b"/>
  <circle cx="87" cy="83" r="3" fill="#fdf6f0"/>
  <circle cx="119" cy="83" r="3" fill="#fdf6f0"/>
  <!-- beak -->
  <path d="M100 96 L86 104 L100 116 L114 104 Z" fill="#f0a202"/>
  </g>
  <g transform="translate(224 44) scale(1)">
  <g fill="none" stroke="#3b2f2a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- k -->
    <path d="M12 12 V80"/>
    <path d="M42 38 L12 62"/>
    <path d="M24 52 L44 80"/>
    <!-- i -->
    <path d="M66 40 V80"/>
    <!-- d -->
    <circle cx="104" cy="58" r="22"/>
    <path d="M126 12 V80"/>
    <!-- u -->
    <path d="M148 38 V60 A20 20 0 0 0 188 60 V38"/>
    <path d="M188 38 V80"/>
    <!-- x -->
    <path d="M210 38 L250 80"/>
    <path d="M250 38 L210 80"/>
  </g>
  <!-- the dot of the i, in the mascot's beak colour -->
  <circle cx="66" cy="18" r="9" fill="#f0a202"/>
  </g>
</svg>
