# The whole disk, erased, in the layout a Kidux installed on Debian has
# (user guide, section 2): the system on one partition and /home, the
# children's work and the family's state, on another, so that the system
# can be written again without touching /home. No manual layout: one
# choice, the one Kidux is made for.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"
userSwapChoices:
    - none
    - file
initialSwapChoice: file
initialPartitioningChoice: erase
allowManualPartitioning: false
drawNestedPartitions: false
alwaysShowPartitionLabels: true
enableLuksAutomatedPartitioning: false
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4"]
partitionLayout:
    - name: "kidux"
      filesystem: "ext4"
      mountPoint: "/"
      size: 40%
      minSize: 16G
      maxSize: 64G
    - name: "kidux-home"
      filesystem: "ext4"
      mountPoint: "/home"
      size: 100%
      minSize: 8G
