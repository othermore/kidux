# GRUB on the disk, as Debian's: under the id `debian`, which Debian's own
# GRUB packages use when they install it again on an upgrade. The removable
# path for firmware that forgets its boot entries is shellprocess@kidux-efi's,
# with the shim, so that it starts under Secure Boot too.
---
efiBootLoader: "grub"
kernel: "/vmlinuz"
img: "/initrd.img"
timeout: "5"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "debian"
installEFIFallback: false
