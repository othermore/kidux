# The administrator's account, the adult who looks after the computer: the
# account the Debian installer makes, in the same groups, with sudo. It is
# not an account any child uses, and its password is not the adult panel's,
# which Kidux's first start asks for. No root password: the administrator
# has sudo, as on a Kidux installed on Debian.
---
defaultGroups:
    - name: cdrom
      must_exist: false
      system: true
    - name: floppy
      must_exist: false
      system: true
    - name: sudo
      must_exist: true
      system: true
    - name: audio
      must_exist: false
      system: true
    - name: dip
      must_exist: false
      system: true
    - name: video
      must_exist: false
      system: true
    - name: plugdev
      must_exist: false
      system: true
    - name: users
      must_exist: false
      system: true
    - name: netdev
      must_exist: false
      system: true
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
allowWeakPasswords: false
user:
    shell: /bin/bash
    forbidden_names: [ root, kidux, _greetd ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "kidux"
    forbidden_names: [ localhost ]
