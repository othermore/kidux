# What only the live system needs, taken off the installed one: the
# installer, and the live boot. apt's autoremove, which Calamares runs after,
# takes what they alone brought.
---
backend: apt
update_db: false
skip_if_no_internet: false
operations:
    - remove:
        - kidux-installer
        - calamares
        - live-boot
        - live-boot-initramfs-tools
