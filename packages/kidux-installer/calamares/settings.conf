# Kidux's installer: Calamares, in the order Kidux installs (docs/dev/image.md).
#
# The live system is a Kidux machine already, with Calamares beside it: the
# installer copies it to the disk whole (unpackfs), makes it the disk's own
# (machine id, fstab, locale, keyboard, the administrator), takes away what
# only the live system needs (packages), makes the initramfs, which the
# image does not carry, and then puts GRUB on the disk, so that its menu
# finds the initramfs. What a family's first start sets up, the wizard does
# on the installed system, as on a Kidux installed on Debian.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: kidux-grub
  module: shellprocess
  config: shellprocess-kidux-grub.conf
- id: kidux-efi
  module: shellprocess
  config: shellprocess-kidux-efi.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - hwclock
  - packages
  - initramfs
  - shellprocess@kidux-grub
  - bootloader
  - shellprocess@kidux-efi
  - umount
- show:
  - finished

branding: kidux
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
