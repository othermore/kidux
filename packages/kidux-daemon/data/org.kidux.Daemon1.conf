<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Only root may own the name; anyone may send to it. Whether a call is
  allowed is decided by polkit and by the daemon itself, not by the bus:
  see /usr/share/polkit-1/rules.d/50-kidux.rules.
-->
<busconfig>
  <policy user="root">
    <allow own="org.kidux.Daemon1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.kidux.Daemon1"/>
  </policy>
</busconfig>
